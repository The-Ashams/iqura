name: iqura
description: "IQURA — apprendre l'arabe et l'arabe coranique (RPG 2D)"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.7.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    # Générés par tools/build_content/build_content.py (non versionnés).
    - assets/content/iqura_content.db
    - assets/content/iqura_content.db.version

