name: iqura
description: "IQURA — apprendre l'arabe et l'arabe coranique (RPG 2D)"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  audioplayers: ^6.8.1
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  fsrs: 2.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  record: 7.1.2
  sqlite3: ^3.7.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    # Générés par tools/build_content/build_content.py (non versionnés).
    - assets/content/iqura_content.db
    - assets/content/iqura_content.db.version
    - assets/fonts/OFL-Amiri.txt
    - assets/fonts/OFL-AmiriQuran.txt
    - assets/fonts/OFL-DotGothic16.txt
    # Pixel art créé pour le projet (tools/build_art/).
    - assets/art/
    # Enregistrements des leçons (synthèse Chatterbox, tools/build_audio/).
    - assets/audio/lecons/
    - assets/sfx/
  # Polices arabes sous SIL Open Font License 1.1 (voir THIRD_PARTY_LICENSES.md).
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    # Police pixel (SIL OFL 1.1), textes du jeu (choisie le 23/10/2026).
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/DotGothic16-Regular.ttf

